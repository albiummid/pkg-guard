name: Release

# Start with: node scripts/cli.js release patch|minor|major --push   (bumps version.yml, commits, tags vX.Y.Z, pushes)
# Re-publish an existing tag to one or both extension registries from the Actions tab (Run workflow).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.1.3)
        required: true
      target:
        description: Where to publish the VS Code extension
        type: choice
        options: [both, marketplace, openvsx]
        default: both

permissions:
  contents: write

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ env.TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Tag must match version.yml and every platform must be in sync
        id: version
        run: |
          version="$(node scripts/cli.js version --print)"
          if [ "${TAG}" != "v${version}" ]; then
            echo "Tag ${TAG} does not match version.yml (${version})." >&2
            exit 1
          fi
          node scripts/cli.js version --check
          node scripts/cli.js changelog --check
          node scripts/cli.js changelog notes "${version}" > /dev/null
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: yarn cli core test
      - run: yarn cli vscode typecheck
      - run: yarn cli vscode package
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew buildPlugin --no-daemon
        working-directory: platforms/jetbrains
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            output/vscode/*.vsix
            output/jetbrains/*.zip
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Create the release (notes from CHANGELOG.md) with both installers attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/cli.js changelog notes "${{ needs.build.outputs.version }}" > release-notes.md
          flags=""
          case "${GITHUB_REF_NAME}" in *-*) flags="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" $flags --notes-file release-notes.md --title "Pkg Guard ${GITHUB_REF_NAME}" $(find dist -type f \( -name '*.vsix' -o -name '*.zip' \))

  # The publish jobs only run when their token secret exists, and never for prereleases.
  # Marketplace and Open VSX are separate jobs so one failing does not block the other.
  # Open VSX also serves Cursor, VSCodium, Windsurf and other VS Code forks.
  publish-marketplace:
    name: Publish to VS Code Marketplace
    needs: [build, github-release]
    if: ${{ !cancelled() && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.github-release.result) && !contains(needs.build.outputs.tag, '-') && (github.event_name == 'push' || contains(fromJSON('["both","marketplace"]'), inputs.target)) }}
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set; skipping the VS Code Marketplace publish."
            exit 0
          fi
          yarn vsce publish --packagePath "$(ls dist/vscode/*.vsix)" --pat "$VSCE_PAT"

  publish-openvsx:
    name: Publish to Open VSX
    needs: [build, github-release]
    if: ${{ !cancelled() && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.github-release.result) && !contains(needs.build.outputs.tag, '-') && (github.event_name == 'push' || contains(fromJSON('["both","openvsx"]'), inputs.target)) }}
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set; skipping the Open VSX publish."
            exit 0
          fi
          yarn ovsx publish "$(ls dist/vscode/*.vsix)" --pat "$OVSX_PAT"

  publish-jetbrains:
    name: Publish JetBrains plugin
    needs: [build, github-release]
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for a token
        id: gate
        run: echo "has_token=$([ -n "$PUBLISH_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.has_token == 'true'
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
        if: steps.gate.outputs.has_token == 'true'
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.has_token == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.has_token == 'true'
      - run: bash ./gradlew publishPlugin --no-daemon
        if: steps.gate.outputs.has_token == 'true'
        working-directory: platforms/jetbrains
