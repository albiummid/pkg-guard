name: Release

# Start with: node scripts/cli.js release patch|minor|major --push   (bumps version.yml, commits, tags vX.Y.Z, pushes)
# Re-publish an existing tag to one or all registries from the Actions tab (Run workflow).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.1.3)
        required: true
      target:
        description: Where to publish
        type: choice
        options: [all, marketplace, openvsx, jetbrains]
        default: all

permissions:
  contents: write

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ env.TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Tag must match version.yml and every platform must be in sync
        id: version
        run: |
          version="$(node scripts/cli.js version --print)"
          if [ "${TAG}" != "v${version}" ]; then
            echo "Tag ${TAG} does not match version.yml (${version})." >&2
            exit 1
          fi
          node scripts/cli.js version --check
          node scripts/cli.js changelog --check
          node scripts/cli.js changelog notes "${version}" > /dev/null
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: yarn cli core test
      - run: yarn cli vscode typecheck
      - run: yarn cli vscode package
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew buildPlugin verifyPlugin --no-daemon
        working-directory: platforms/jetbrains
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            output/vscode/*.vsix
            output/jetbrains/*.zip
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Create the release (notes from CHANGELOG.md) with both installers attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/cli.js changelog notes "${{ needs.build.outputs.version }}" > release-notes.md
          flags=""
          case "${GITHUB_REF_NAME}" in *-*) flags="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" $flags --notes-file release-notes.md --title "Pkg Guard ${GITHUB_REF_NAME}" $(find dist -type f \( -name '*.vsix' -o -name '*.zip' \))

  # The publish jobs never run for prereleases. Open VSX and JetBrains skip when their token secret is missing;
  # the VS Code Marketplace uses Trusted Publishing (GitHub OIDC, no secret), set up on the publisher page.
  # Each registry is a separate job so one failing does not block the others.
  # Open VSX also serves Cursor, VSCodium, Windsurf and other VS Code forks.
  publish-marketplace:
    name: Publish to VS Code Marketplace
    needs: [build, github-release]
    if: ${{ !cancelled() && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.github-release.result) && !contains(needs.build.outputs.tag, '-') && (github.event_name == 'push' || contains(fromJSON('["all","marketplace"]'), inputs.target)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish
        run: yarn vsce publish --packagePath "$(ls dist/vscode/*.vsix)" --oidc

  publish-openvsx:
    name: Publish to Open VSX
    needs: [build, github-release]
    if: ${{ !cancelled() && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.github-release.result) && !contains(needs.build.outputs.tag, '-') && (github.event_name == 'push' || contains(fromJSON('["all","openvsx"]'), inputs.target)) }}
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set; skipping the Open VSX publish."
            exit 0
          fi
          yarn ovsx publish "$(ls dist/vscode/*.vsix)" --pat "$OVSX_PAT"

  publish-jetbrains:
    name: Publish to JetBrains Marketplace
    needs: [build, github-release]
    if: ${{ !cancelled() && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.github-release.result) && !contains(needs.build.outputs.tag, '-') && (github.event_name == 'push' || contains(fromJSON('["all","jetbrains"]'), inputs.target)) }}
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check for a token and signing keys
        id: gate
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::warning::JETBRAINS_PUBLISH_TOKEN is not set; skipping the JetBrains Marketplace publish."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CERTIFICATE_CHAIN" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::JETBRAINS_CERTIFICATE_CHAIN and JETBRAINS_PRIVATE_KEY must be set to publish a signed plugin." >&2
            exit 1
          fi
          echo "has_token=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.has_token == 'true'
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.has_token == 'true'
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
        if: steps.gate.outputs.has_token == 'true'
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.has_token == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.has_token == 'true'
      # publishPlugin builds, signs (signPlugin) and uploads the plugin.
      - run: bash ./gradlew publishPlugin --no-daemon
        if: steps.gate.outputs.has_token == 'true'
        working-directory: platforms/jetbrains
